[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wisp-transcribe-cli"
version = "0.1.0"
description = "CLI agêntica para Wisp Transcribe"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/thepokenik/wisp-transcribe"

[project.scripts]
transcribe = "transcription_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
